name: Dockerfile - API FinanceEdgeTrack

network:
  FinanceEdgeTrackNetwork: 
    driver: bridge

volumes:
   postgres-data: 


services:
   postgres-db:
    image: postgres:18-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD_SHELL", "pg_isready -U $${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      tiomeout: 20s
      retries: 10
    ports:
      - "5438:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    network:
      - FinanceEdgeTrackNetwork

    
   financeEdgeTrack-api:
     build:
      context: .
      dockerfile: FinanceEdgeTrack/Dockerfile
     container_name: FinanceEdgeTrack-api
     env_file:  # env file with depedencies
      - .env
     environment:
       ASPNETCORE_ENVIRONMENT: Development
     ports:
      - "8099:8080"
     depends_on:
      - postgres-db
          condition: service_healthy
     network:
       - FinanceEdgeTrackNetwork
  